<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>牧 勝己 | Katsumi Maki</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f7f8fa;
    color: #333;
}

.container {
    max-width: 760px;
    margin: auto;
    padding: 40px 20px;
}

.card {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 {
    margin: 0;
    font-size: 2.4rem;
}

.subtitle {
    color: #666;
    margin-top: 8px;
    font-size: 1.1rem;
}

.badge {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 14px;
    border-radius: 20px;
    background: #eef3ff;
    color: #1d4ed8;
    font-size: 0.9rem;
}

.section {
    margin-top: 36px;
}

.section h2 {
    font-size: 1.2rem;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 8px;
}

.profile {
    line-height: 1.9;
}

.social-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px 20px;
    margin-top: 26px;
}

.social-item {
    text-align: center;
}

.social-item a {
    width: 62px;
    height: 62px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 28px;
    text-decoration: none;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.social-item a:hover {
    transform: translateY(-4px);
    opacity: 0.9;
}

.social-item span {
    display: block;
    margin-top: 9px;
    font-size: 0.82rem;
    color: #666;
}

.linkedin {
    background: #0A66C2;
}

.facebook {
    background: #1877F2;
}

.instagram {
    background: #E4405F;
}

.github {
    background: #24292F;
}

.qiita {
    background: #55C500;
}

.ted {
    background: #E62B1E;
}

.footer {
    margin-top: 50px;
    text-align: center;
    color: #888;
    font-size: 0.9rem;
}

@media (max-width: 600px) {
    .container {
        padding: 24px 14px;
    }

    .card {
        padding: 24px;
    }

    h1 {
        font-size: 2rem;
    }

    .social-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 22px 10px;
    }

    .social-item a {
        width: 54px;
        height: 54px;
        font-size: 24px;
    }

    .social-item span {
        font-size: 0.75rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>牧 勝己</h1>
        <div class="subtitle">Katsumi Maki</div>

        <div class="badge">
            国家資格キャリアコンサルタント（資格保有）
        </div>

        <div class="section">
            <h2>プロフィール</h2>
            <div class="profile">
                ネットワークエンジニア。<br>
                国家資格キャリアコンサルタント資格を保有しています。<br>
                TEDやCoderDojoなどのコミュニティ活動にも参加しています。
            </div>
        </div>

        <div class="section">
            <h2>リンク</h2>

            <div class="social-grid">

                <div class="social-item">
                    <a class="linkedin"
                       href="https://www.linkedin.com/in/katsumi-maki/"
                       target="_blank"
                       aria-label="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <span>LinkedIn</span>
                </div>

                <div class="social-item">
                    <a class="facebook"
                       href="https://www.facebook.com/katsumi.maki.16"
                       target="_blank"
                       aria-label="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <span>Facebook</span>
                </div>

                <div class="social-item">
                    <a class="instagram"
                       href="https://www.instagram.com/k_maki2019/"
                       target="_blank"
                       aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <span>Instagram</span>
                </div>

                <div class="social-item">
                    <a class="github"
                       href="https://github.com/katsumi2018"
                       target="_blank"
                       aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <span>GitHub</span>
                </div>

                <div class="social-item">
                    <a class="qiita"
                       href="https://qiita.com/k-maki"
                       target="_blank"
                       aria-label="Qiita">
                        <i class="fa-solid fa-pen"></i>
                    </a>
                    <span>Qiita</span>
                </div>

                <div class="social-item">
                    <a class="ted"
                       href="https://www.ted.com/profiles/11497861"
                       target="_blank"
                       aria-label="TED">
                        <i class="fa-solid fa-play"></i>
                    </a>
                    <span>TED</span>
                </div>

            </div>
        </div>

        <div class="footer">
            © Katsumi Maki
        </div>

    </div>
</div>

</body>
</html>
