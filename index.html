<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牧 勝己 | Katsumi Maki</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f7f8fa;
    color: #333;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 40px 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 {
    margin: 0;
    font-size: 2.4rem;
}

.subtitle {
    color: #666;
    margin-top: 8px;
}

.badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #eef3ff;
    color: #1d4ed8;
    font-size: 0.9rem;
}

.section {
    margin-top: 36px;
}

.section h2 {
    font-size: 1.2rem;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 8px;
}

.link-list {
    display: grid;
    gap: 12px;
}

.link-button {
    display: block;
    text-decoration: none;
    color: white;
    background: #2563eb;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    transition: 0.2s;
}

.link-button:hover {
    background: #1d4ed8;
}

.profile {
    line-height: 1.8;
}

.footer {
    margin-top: 40px;
    text-align: center;
    color: #888;
    font-size: 0.9rem;
}

@media (max-width: 600px) {
    .card {
        padding: 24px;
    }

    h1 {
        font-size: 2rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>牧 勝己</h1>
        <div class="subtitle">Katsumi Maki</div>

        <div class="badge">
            国家資格キャリアコンサルタント（資格保有）
        </div>

        <div class="section">
            <h2>プロフィール</h2>

            <div class="profile">
                ネットワークエンジニア<br>
                国家資格キャリアコンサルタント資格を保有しています。<br>
                TEDxやCoderDojoなどの活動にも参加しています。
            </div>
        </div>

        <div class="section">
            <h2>リンク</h2>

            <div class="link-list">

                <a class="link-button"
                   href="https://www.linkedin.com/in/katsumi-maki/"
                   target="_blank">
                    LinkedIn
                </a>

                <a class="link-button"
                   href="https://github.com/katsumi2018"
                   target="_blank">
                    GitHub
                </a>

                <a class="link-button"
                   href="https://qiita.com/k-maki"
                   target="_blank">
                    Qiita
                </a>

                <a class="link-button"
                   href="https://www.ted.com/profiles/11497861"
                   target="_blank">
                    TED Profile
                </a>
                
            </div>
        </div>


        <div class="footer">
            © Katsumi Maki
        </div>

    </div>

</div>

</body>
</html>
